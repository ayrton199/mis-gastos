<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f4a6d"/>
      <stop offset="1" stop-color="#06263b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".2" r=".55">
      <stop offset="0" stop-color="#00C3D9" stop-opacity=".45"/>
      <stop offset="1" stop-color="#00C3D9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA94D"/>
      <stop offset=".55" stop-color="#FF5C00"/>
      <stop offset="1" stop-color="#e84f00"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fe3f2"/>
      <stop offset="1" stop-color="#00a6bb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- estela de movimiento -->
  <g stroke="#EEF2F7" stroke-linecap="round" fill="none">
    <path d="M150 92 L212 132" stroke-width="16" opacity=".35"/>
    <path d="M118 148 L206 186" stroke-width="16" opacity=".22"/>
    <path d="M196 54 L246 100" stroke-width="16" opacity=".5"/>
  </g>
  <!-- moneda con la "A" -->
  <g transform="rotate(14 318 150)">
    <circle cx="318" cy="150" r="82" fill="url(#coin)"/>
    <circle cx="318" cy="150" r="64" fill="none" stroke="#EEF2F7" stroke-width="7" opacity=".55"/>
    <path d="M286 192 L318 106 L350 192 M297 165 H339" fill="none" stroke="#EEF2F7" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- billetera -->
  <rect x="72" y="214" width="352" height="232" rx="56" fill="url(#wallet)"/>
  <path d="M72 280 Q72 234 128 234 H368 Q424 234 424 280" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="10"/>
  <rect x="318" y="292" width="132" height="84" rx="42" fill="#0B3954"/>
  <circle cx="370" cy="334" r="17" fill="#FFA94D"/>
</svg>
